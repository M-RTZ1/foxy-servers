name: Fetch Mozilla Servers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download from Mozilla link
        run: |
          curl -sS "https://firefox.settings.services.mozilla.com/v1/buckets/main/collections/vpn-serverlist/records" -o servers.json
      - name: Save servers.json to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add servers.json
          git diff --staged --quiet || (git commit -m "Update servers.json" && git push)